<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCPlus Email — Email Marketing Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- LOGIN -->
<div id="loginPage" class="login-wrapper" style="display:none;">
  <div class="login-card">
    <div class="login-logo">
      <i class="bi bi-envelope-paper-fill"></i>
      <h2>PCPlus Email</h2>
      <p style="color:var(--text-muted);font-size:.85rem;">Email Marketing Platform</p>
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm" autocomplete="off">
      <div style="margin-bottom:12px;">
        <label class="form-label-dark">Username</label>
        <input type="text" class="form-control-dark" id="loginUsername" placeholder="Enter username" required>
      </div>
      <div style="margin-bottom:16px;">
        <label class="form-label-dark">Password</label>
        <input type="password" class="form-control-dark" id="loginPassword" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary-custom" style="width:100%;justify-content:center;padding:10px;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appWrapper" class="app-wrapper" style="display:none;">
  <button class="mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-envelope-paper-fill"></i> PCPlus Email</div>
    <ul class="sidebar-nav" id="sidebarNav">
      <li class="sidebar-section">Main</li>
      <li class="nav-item"><a class="nav-link active" data-page="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="sidebar-section">Email</li>
      <li class="nav-item"><a class="nav-link" data-page="contacts"><i class="bi bi-people"></i> Contacts</a></li>
      <li class="nav-item"><a class="nav-link" data-page="lists"><i class="bi bi-collection"></i> Lists</a></li>
      <li class="nav-item"><a class="nav-link" data-page="templates"><i class="bi bi-file-earmark-code"></i> Templates</a></li>
      <li class="nav-item"><a class="nav-link" data-page="compose"><i class="bi bi-pencil-square"></i> Compose</a></li>
      <li class="sidebar-section">Reports</li>
      <li class="nav-item"><a class="nav-link" data-page="campaigns"><i class="bi bi-megaphone"></i> Campaigns</a></li>
      <li class="nav-item"><a class="nav-link" data-page="activity"><i class="bi bi-activity"></i> Activity Log</a></li>
      <li class="sidebar-section">System</li>
      <li class="nav-item"><a class="nav-link" data-page="settings"><i class="bi bi-gear"></i> Settings</a></li>
    </ul>
    <div class="sidebar-footer">
      <span id="userDisplay"></span>
      <a href="#" id="logoutBtn" style="float:right;color:var(--text-muted);"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </nav>

  <div class="main-content" id="mainContent"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
